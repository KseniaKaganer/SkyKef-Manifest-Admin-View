<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jumpers Data | SkyKef Manifest Admin View</title><link rel="stylesheet" href="style.css?v=public-registration-1">  <script src="auth.js?v=public-registration-1"></script>
</head><body>
<header class="site-header"><div class="header-inner"><h1>SkyKef Manifest Admin View</h1><nav class="nav">
      <a href="jumpers-data.html">Jumpers Data</a>
      <a href="today-jumpers.html">Today Jumpers</a>
      <a href="loads.html">Loads</a>
      <a href="loads-history.html">Loads History</a>
      <a href="daily-report.html">Daily Report</a>
      <a href="reports.html">Reports</a>
    </nav></div></header>
<main class="page">
<div class="toolbar"><input id="searchInput" class="search" type="search" placeholder="Search jumper by name, surname, phone or ID..."><button id="reloadBtn" class="small-btn" type="button">Reload Data</button></div>
<div id="status" class="status">Loading jumpers…</div><section class="admin-grid"><div class="list-panel"><div class="panel-head">Jumpers</div><div id="jumpersList" class="jumpers-list"></div></div><div class="detail-panel">
  <div class="detail-tabs" role="tablist" aria-label="Jumper information">
    <button id="detailsTab" class="detail-tab active" type="button" role="tab" aria-selected="true">Jumper Details</button>
    <button id="logbookTab" class="detail-tab" type="button" role="tab" aria-selected="false">Jumper Logbook</button>
  </div>

  <div id="detailsView">
    <div id="details" class="detail-empty">Select a jumper to view all data.</div>
  </div>

  <div id="logbookView" hidden>
    <section id="logbookAnnualStats" class="logbook-annual-stats" hidden></section>
    <div id="logbookStatus" class="logbook-status">Select a jumper to view the logbook.</div>
    <div class="logbook-scroll">
      <table class="logbook-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Load</th>
            <th>Activity</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="logbookBody"></tbody>
      </table>
    </div>
  </div>
</div></section>
</main>
<script src="today-jumpers-data.js"></script>
<script src="logbook-annual-stats.js?v=actual-jumps-1"></script>
<script src="jumper-editor.js?v=editor-rows-1"></script>
<script src="jumpers-data.js?v=annual-stats-1"></script></body></html>
