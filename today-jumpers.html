<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Today Jumpers | SkyKef Manifest Admin View</title><link rel="stylesheet" href="style.css?v=settings-theme-1">  <script src="preferences.js?v=local-checkin-14"></script>
<script src="auth.js?v=merge-history-1"></script>
<link rel="stylesheet" href="report-calendar.css?v=sunday-1">
<style>
.daily-report-date-control{position:relative;display:inline-flex;align-items:center;gap:8px;margin-bottom:12px}

#todayDate{display:inline-block;margin:0 0 20px;padding:10px 14px;font-size:1.15rem;font-weight:700;line-height:1.4;color:var(--text);background:var(--theme-hover, #10253a);border:1px solid #315a7f;border-radius:10px}

.today-jumper-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.today-jumper-count{font-size:13px;font-weight:600;white-space:nowrap}
#jumpersList{display:flex;flex-direction:column;gap:16px;padding:12px;max-height:none;overflow:visible}
.today-jumper-group{max-height:32vh;min-height:140px;overflow-y:auto;overscroll-behavior-y:contain;scrollbar-gutter:stable;border:1px solid var(--border);border-radius:12px}
.today-jumper-group-title{position:sticky;top:0;z-index:1;margin:0;padding:12px 18px;background:var(--theme-surface-alt, #151c23);font-size:14px;border-bottom:1px solid var(--theme-line, #20262d)}
@media(max-width:800px){.today-jumper-group{max-height:30vh}}
</style>
<link rel="stylesheet" href="theme.css?v=logbook-years-13">
</head><body data-jumpers-scope="today">
<header class="site-header"><div class="header-inner"><h1>SkyKef Manifest Admin View</h1><nav class="nav">
      <a href="jumpers-data.html">Jumpers Data</a>
      <a href="today-jumpers.html" class="active">Today Jumpers</a>
      <a href="loads.html">Loads</a>
      <a href="loads-history.html">Loads History</a>
      <a href="daily-report.html">Daily Report</a>
      <a href="reports.html">Reports</a>
    </nav></div></header>
<main class="page">
<h2>Today Jumpers</h2>
<div class="daily-report-date-control"><span>Date</span><input id="reportDateInput" type="hidden">
<button id="reportCalendarButton" class="small-btn" type="button" aria-expanded="false" aria-controls="reportCalendarPopup" disabled>Loading dates…</button>
<div id="reportCalendarPopup" class="report-calendar" hidden role="dialog" aria-label="Choose work day">
<div class="report-calendar-nav"><button id="reportCalendarPrev" type="button" aria-label="Previous month">‹</button><select id="reportCalendarMonth" aria-label="Month"></select><select id="reportCalendarYear" aria-label="Year"></select><button id="reportCalendarNext" type="button" aria-label="Next month">›</button></div>
<div class="report-calendar-weekdays" aria-hidden="true"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div>
<div id="reportCalendarDays" class="report-calendar-days"></div><p id="reportCalendarMessage" role="status"></p>
</div></div>
<p id="todayDate" class="status">Loading active date…</p>
<div class="toolbar"><input id="searchInput" class="search" type="search" placeholder="Search jumper by name, surname, phone or ID..."><button id="reloadBtn" class="small-btn" type="button">Reload Data</button></div>
<div id="status" class="status">Loading jumpers…</div><section class="admin-grid"><div class="list-panel"><div class="panel-head today-list-heading"><span>Today Jumpers</span><button id="todayJumpSort" class="small-btn today-sort-toggle" type="button" value="desc" aria-label="Sort by jumps: most to fewest" aria-pressed="false">Most to fewest ↓</button></div><div id="jumpersList" class="jumpers-list"></div></div><div class="detail-panel">
  <div class="detail-tabs" role="tablist" aria-label="Jumper information">
    <button id="detailsTab" class="detail-tab active" type="button" role="tab" aria-selected="true">Jumper Details</button>
    <button id="logbookTab" class="detail-tab" type="button" role="tab" aria-selected="false">Jumper Logbook</button>
  </div>

  <div id="detailsView">
    <div id="details" class="detail-empty">Select a jumper to view all data.</div>
  </div>

  <div id="logbookView" hidden>
    <section id="logbookAnnualStats" class="logbook-annual-stats" hidden></section>
    <div id="logbookStatus" class="logbook-status">Select a jumper to view the logbook.</div>
    <div class="logbook-scroll">
      <table class="logbook-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Load</th>
            <th>Activity</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="logbookBody"></tbody>
      </table>
    </div>
  </div>
</div></section>
</main>
<script src="today-jumpers-data.js?v=today-toggle-3"></script>
<script src="logbook-annual-stats.js?v=collapsible-2"></script>
<script src="jumper-editor.js?v=editor-rows-1"></script>
<script src="report-calendar.js?v=sunday-1"></script>
<script src="jumpers-data.js?v=active-dates-4"></script></body></html>
