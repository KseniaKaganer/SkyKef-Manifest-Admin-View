<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registration Form | SkyKef Manifest</title>
  <link rel="stylesheet" href="style.css?v=settings-theme-1">
  <script src="preferences.js?v=logbook-types-2"></script>
<script src="auth.js?v=admin-registration-6"></script>
  <style>
    .registration-page{max-width:1000px}
    .registration-page-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
    .registration-page-heading h2{margin:0 0 8px}
    .registration-page-heading p{margin:0;color:var(--muted)}
    .registration-original-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
    .registration-embed{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#fff}
    .registration-embed iframe{display:block;width:100%;height:1500px;border:0;background:#fff}
    @media(max-width:600px){.registration-page{padding:20px 10px}.registration-embed iframe{height:1650px}}
  </style>
<link rel="stylesheet" href="theme.css?v=settings-icon-5">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div class="registration-page-heading" style="margin-bottom:0"><h1>SkyKef Manifest</h1><a class="small-btn" href="index.html" aria-label="Home">Home</a></div>
    <nav class="nav" aria-label="Main navigation"><a href="index.html">Loads</a><a href="registration.html" class="active">Registration Form</a></nav>
  </div>
</header>
<main class="page registration-page">
  <div class="registration-page-heading">
    <div><h2>Jumping Day Registration</h2><p lang="he" dir="rtl">סקיכיף — טופס הרשמה ליום פעילות</p></div>
    <a id="registrationOriginalLink" class="small-btn registration-original-link" href="https://docs.google.com/forms/d/e/1FAIpQLSeFem8JsrpMqbjNy95eaZVijdfKK-ptlyiDPB2LPLJefuomBg/viewform" target="_blank" rel="noopener noreferrer">Open in Google Forms ↗</a>
  </div>
  <p id="registrationFormStatus" class="status" role="status">Loading form…</p>
  <section class="registration-embed" aria-label="Registration form">
    <iframe id="registrationFrame" hidden title="SkyKef jumping day registration form" referrerpolicy="strict-origin-when-cross-origin">Loading registration form…</iframe>
  </section>
</main>
<script src="registration.js?v=profile-prefill-1"></script>
</body>
</html>
