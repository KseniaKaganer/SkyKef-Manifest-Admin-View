<style>

.load-row.next-load,
.load-row.next-load:hover,
.load-row.next-load.active {
  background:var(--theme-warning-bg, #3a300d);
  box-shadow:inset 4px 0 0 #ffd45a;
}
.load-row.next-load .load-row-title,
.load-row.next-load .load-row-arrow,
.next-load-title { color:var(--theme-warning-text, #ffe394); }
.load-row.next-load .load-row-sub { color:var(--theme-warning-text, #e4d6a1); }
.jumper-manifest-summary {
  margin-bottom:22px;padding:20px 24px;border:2px solid #ffd45a;
  border-radius:16px;background:var(--theme-warning-bg, #3a300d);color:var(--theme-warning-text, #fff1b8);line-height:1.5;
}
.jumper-manifest-summary[hidden] { display:none; }
.jumper-manifest-summary strong { display:block;font-size:1.15rem; }
.jumper-manifest-summary p { margin:8px 0 0;color:var(--theme-warning-text, #ffe394); }

#publicLoadsCard { max-width:1280px; }
#todayLoadsLayout[hidden], #notStartedCard[hidden] { display:none; }
#publicLoadsCard .status { margin-bottom:0; }
#publicLoadsCard #reloadBtn { justify-self:start; }

.loads-date-actions { display:flex;align-items:center;gap:12px;flex-wrap:wrap; }
#publicLoadsCard .loads-date-actions #reloadBtn { min-height:36px;padding:0 12px;border-radius:10px; }

.loads-heading-actions { display:flex;align-items:center;justify-content:space-between;gap:12px; }
#publicLoadsCard .loads-heading-actions h2 { margin:0 0 8px; }
#publicLoadsCard .loads-heading-actions #reloadBtn { flex:0 0 auto;min-height:36px;padding:0 12px;border-radius:10px; }
#publicLoadsCard #loadsStatus:empty { display:none; }

<header class="site-header">
  <div class="header-inner home-header">
    <h1 id="siteTitle">SkyKef Manifest</h1>
    <div class="header-account-actions">
      <button id="jumperLogoutBtn" class="small-btn" type="button" hidden>Logout</button>
      <button id="openLoginBtn" class="small-btn header-login-btn" type="button">Login</button>
    </div>
  </div>
</header>

<main class="page">


  <section id="publicLoadsCard" class="public-loads-card" aria-labelledby="publicLoadsTitle">
    <div id="publicLoadsIntro">
      <div class="loads-heading-actions">
        <h2 id="publicLoadsTitle">Today's Loads</h2>
        <button id="reloadBtn" class="small-btn" type="button">Refresh</button>
      </div>
      <p id="todayLabel" class="public-loads-status" aria-live="polite">Checking today's loads…</p>
    </div>
  <section id="jumperManifestSummary" class="jumper-manifest-summary" hidden aria-live="polite">
    <strong id="jumperJumpTotals"></strong>
    <p id="jumperManifestLoads"></p>
    <p id="jumperPastLoads" class="manifest-past-loads"></p>
    <p id="jumperInAirLoad"></p>
  </section>
  <div id="loadsStatus" class="status" aria-live="polite"></div>
  <section id="todayLoadsLayout" class="loads-layout" hidden>

      <div class="panel-head">Today's Loads</div>

<script src="jumper-manifest-progress.js?v=ended-day-1"></script>
<script>
(() => {
  const DB = "https://skykef-app-default-rtdb.europe-west1.firebasedatabase.app";
  const siteTitle = document.getElementById("siteTitle");
  const publicLoadsCard = document.getElementById("publicLoadsCard");
  const loginCard = document.getElementById("loginCard");
  const loginOverlay = document.getElementById("loginOverlay");
  const openLoginBtn = document.getElementById("openLoginBtn");
  const jumperLogoutBtn = document.getElementById("jumperLogoutBtn");
  const closeLoginBtn = document.getElementById("closeLoginBtn");
  const adminHome = document.getElementById("adminHome");
  const loginForm = document.getElementById("loginForm");
  const loginBtn = document.getElementById("loginBtn");
  const loginStatus = document.getElementById("loginStatus");
  const welcomeAdmin = document.getElementById("welcomeAdmin");
  const logoutBtn = document.getElementById("logoutBtn");
  const publicLoadsIntro = document.getElementById("publicLoadsIntro");
  const publicLoadsStatus = document.getElementById("todayLabel");
  const publicLoadsLink = document.getElementById("publicLoadsLink");
  const publicDayNotStarted = document.getElementById("notStartedCard");

  function datePartsFromCurrentData(currentData) {
    const raw = currentData?.date;
    if (raw === null || raw === undefined || String(raw).trim() === "") return null;
    const value = String(raw).trim();
    let match = value.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
    if (match) return { y: match[1], m: String(Number(match[2])), d: String(Number(match[3])) };
    match = value.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
    if (match) {
      const monthFirst = /\b(?:AM|PM)\b/i.test(value) || Number(match[2]) > 12;
      return {
        y: match[3],
        m: String(Number(match[monthFirst ? 1 : 2])),
        d: String(Number(match[monthFirst ? 2 : 1]))
      };
    }
    return null;
  }

  function isCurrentDataToday(currentData) {
    const parts = datePartsFromCurrentData(currentData);
    if (!parts) return false;
    const today = Object.fromEntries(
      new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Jerusalem",
        year: "numeric",
        month: "numeric",
        day: "numeric"
      }).formatToParts(new Date())
        .filter(part => part.type !== "literal")
        .map(part => [part.type, String(Number(part.value))])
    );
    return parts.y === today.year && parts.m === today.month && parts.d === today.day;
  }

  function findTodayLoads(data, currentData) {
    if (!data || typeof data !== "object") return null;
    const parts = datePartsFromCurrentData(currentData);
    if (!parts) return data;
    const { y, m, d } = parts;
    const mm = m.padStart(2, "0");
    const dd = d.padStart(2, "0");

    const nestedDay = data[y]?.[m]?.[d] ?? data[y]?.[m]?.[dd] ??
      data[y]?.[mm]?.[d] ?? data[y]?.[mm]?.[dd];
    if (nestedDay && typeof nestedDay === "object") return nestedDay;

    const dayNode = data[d] ?? data[dd];
    if (dayNode && typeof dayNode === "object") return dayNode;

    return data;
  }

  function hasLoadRecords(loadsNode) {
    return Boolean(loadsNode && typeof loadsNode === "object" &&
      Object.values(loadsNode).some(load =>
        load && typeof load === "object" &&
        Object.values(load).some(value => value !== null && value !== undefined)
      ));
  }

  function closeLogin() {
    loginOverlay.hidden = true;
    loginStatus.textContent = "";
  }

  function openLogin() {
    loginOverlay.hidden = false;
    requestAnimationFrame(() => document.getElementById("username").focus());
  }

  function showHome(session) {
    if (["admin", "manifest"].includes(session.role)) {
      location.replace("jumpers-data");
      return;
    }
    closeLogin();
    openLoginBtn.hidden = true;

    if (session.role === "jumper") {
      document.title = "SkyKef Manifest";
      siteTitle.textContent = "SkyKef Manifest";
      publicLoadsCard.hidden = false;
      adminHome.hidden = true;
      jumperLogoutBtn.hidden = false;
    } else {
      document.title = "SkyKef Manifest Admin View";
      siteTitle.textContent = "SkyKef Manifest Admin View";
      publicLoadsCard.hidden = true;
      adminHome.hidden = false;
      jumperLogoutBtn.hidden = true;
      welcomeAdmin.textContent = `Logged in as ${session.username} · ${session.role === "admin" ? "Admin" : "Manifest"}`;
    }
    SkyKefAdminAuth.showSessionRole();
    if (session.role === "jumper") document.getElementById("reloadBtn").click();
  }


  const existing = SkyKefAdminAuth.getSession();
  if (existing) showHome(existing);

  const usernameInput = document.getElementById("username");
  let loginUsers = [];
  loginBtn.disabled = false;

  usernameInput.addEventListener("input", () => {
    const start = usernameInput.selectionStart;
    usernameInput.value = usernameInput.value.toLowerCase();
    usernameInput.setSelectionRange(start, start);
  });

  SkyKefAdminAuth.getLoginUsers().then(users => {
    loginUsers = users;
  }).catch(error => {
    console.error(error);
    loginUsers = [];
  });

  loginForm.addEventListener("submit", async event => {
    event.preventDefault();
    loginStatus.textContent = "";
    loginBtn.disabled = true;
    loginBtn.textContent = "Checking…";

    const typedUsername = usernameInput.value.trim().toLowerCase();
    const user = loginUsers.find(item => item.username.toLowerCase() === typedUsername);
    const username = user?.username || typedUsername;
    const password = document.getElementById("password").value;

    try {
      const validStaff = user
        ? await SkyKefAdminAuth.verifyUser(username, password, user.role)
        : false;

      if (validStaff) {
        SkyKefAdminAuth.createSession(username, "admin");
      } else {
        const jumper = await SkyKefAdminAuth.verifyJumper(typedUsername, password);
        if (!jumper) {
          loginStatus.textContent = "Incorrect username or password.";
          return;
        }
        SkyKefAdminAuth.createJumperSession(jumper);
      }

      showHome(SkyKefAdminAuth.getSession());
      loginForm.reset();
    } catch (error) {
      console.error(error);
      loginStatus.textContent = "Could not verify login. Check Firebase access.";
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Login";
    }
  });

  openLoginBtn.addEventListener("click", openLogin);
  if (!SkyKefAdminAuth.getSession() && new URLSearchParams(location.search).get("login") === "1") {
    openLogin();
    const cleanUrl=new URL(location.href);cleanUrl.searchParams.delete("login");
    history.replaceState(null,"",cleanUrl.pathname+cleanUrl.search+cleanUrl.hash);
  }
  closeLoginBtn.addEventListener("click", closeLogin);
  loginOverlay.addEventListener("click", event => {
    if (event.target === loginOverlay) closeLogin();
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !loginOverlay.hidden) closeLogin();
  });
  jumperLogoutBtn.addEventListener("click", SkyKefAdminAuth.logout);
  logoutBtn.addEventListener("click", SkyKefAdminAuth.logout);

})();
</script>
<script>
(() => {
  const DB = "https://skykef-app-default-rtdb.europe-west1.firebasedatabase.app";

  const reloadBtn = document.getElementById("reloadBtn");
  const todayLabel = document.getElementById("todayLabel");
  const loadsStatus = document.getElementById("loadsStatus");
  const notStartedCard = document.getElementById("notStartedCard");
  const todayLoadsLayout = document.getElementById("todayLoadsLayout");
  const loadsList = document.getElementById("loadsList");
  const loadTitle = document.getElementById("loadTitle");
  const loadSummary = document.getElementById("loadSummary");
  const loadBody = document.getElementById("loadBody");

  let jumpersByUid = new Map();
  let currentLoads = [];
  let inAirLoad = null;
  let dayEnded = false;

  function formatCurrentDataDate(currentData) {
    const raw = currentData?.date;
    return raw === null || raw === undefined || String(raw).trim() === ""
      ? "Date unavailable"
      : SkyKefAdminAuth.formatDate(raw);
  }

  function datePartsFromCurrentData(currentData) {
    const raw = currentData?.date;
    if (raw === null || raw === undefined || String(raw).trim() === "") return null;
    const value = String(raw).trim();
    let match = value.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
    if (match) return { y: match[1], m: String(Number(match[2])), d: String(Number(match[3])) };
    match = value.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
    if (match) {
      const monthFirst = /\b(?:AM|PM)\b/i.test(value) || Number(match[2]) > 12;
      return {
        y: match[3],
        m: String(Number(match[monthFirst ? 1 : 2])),
        d: String(Number(match[monthFirst ? 2 : 1]))
      };
    }
    return null;
  }

  function isCurrentDataToday(currentData) {
    const parts = datePartsFromCurrentData(currentData);
    if (!parts) return false;
    const today = Object.fromEntries(
      new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Jerusalem",
        year: "numeric",
        month: "numeric",
        day: "numeric"
      }).formatToParts(new Date())
        .filter(part => part.type !== "literal")
        .map(part => [part.type, String(Number(part.value))])
    );
    return parts.y === today.year && parts.m === today.month && parts.d === today.day;
  }

  function displayName(j, uid) {
    if (!j || typeof j !== "object") return `UID ${uid}`;
    const name = `${j.Name ?? ""} ${j.Surname ?? ""}`.trim();
    return name || `UID ${uid}`;
  }

  function normalizeJumpers(data) {
    const map = new Map();
    if (!data || typeof data !== "object") return map;

    Object.entries(data).forEach(([key, value]) => {
      if (!value || typeof value !== "object") return;
      const uid = value.Uid ?? value.uid ?? key;
      map.set(String(uid), value);
    });

    return map;
  }

  async function fetchJson(path) {
    return LoadViewTools.fetchJson(`${DB}/${path}.json`);
  }

  function parseActivityValue(value) {
    if (value === null || value === undefined) {
      return { activity: "—", details: "—", specialData: [] };
    }

    if (typeof value === "object") {
      const activityKeys = ["activity", "Activity", "type", "Type", "jumpType", "jump_type"];
      const detailKeys = ["details", "Details", "detail", "Detail", "notes", "Notes", "comment", "Comment", "info", "Info"];
      const findValue = keys => {
        for (const key of keys) if (value[key] !== undefined && value[key] !== null) return value[key];
        return undefined;
      };
      const formatValue = item => {
        if (Array.isArray(item)) return item.map(formatValue).filter(Boolean).join(", ");
        if (item && typeof item === "object") return JSON.stringify(item);
        if (typeof item === "boolean") return item ? "Yes" : "";
        return String(item ?? "").trim();
      };
      const activity = formatValue(findValue(activityKeys)) || "Record";
      const details = formatValue(findValue(detailKeys)) || "—";
      const ignored = new Set([...activityKeys, ...detailKeys, "uid", "Uid", "name", "Name", "surname", "Surname"]);
      const specialData = Object.entries(value)
        .filter(([key]) => !ignored.has(key))
        .map(([key, item]) => {
          const formatted = formatValue(item);
          if (!formatted || formatted === "—") return "";
          const label = key.replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/[_-]+/g, " ").trim();
          return label ? label.charAt(0).toUpperCase() + label.slice(1) + ": " + formatted : formatted;
        })
        .filter(Boolean);
      return { activity, details, specialData };
    }

    const raw = String(value).trim();
    if (raw.includes("|")) {
      const parts = raw.split("|");
      return {
        activity: parts[0] || "—",
        details: parts.slice(1).filter(Boolean).join(" · ") || "—",
        specialData: []
      };
    }
    return { activity: raw || "—", details: "—", specialData: [] };
  }

  function jumperCountForActivity(activity) {
    const value = String(activity ?? "").trim().toUpperCase();
    return value.startsWith("T") ? 2 : 1;
  }

  function getLoadNumber(loadKey) {
    const match = String(loadKey).match(/\d+/);
    return match ? Number(match[0]) : 0;
  }

  function manifestAltitude(value) {
    const altitude=String(value ?? "").trim();
    return {"10":"10","12":"12","10000":"10","12000":"12"}[altitude] || "";
  }

  function loadEntryAltitude(value,loadValue) {
    if(typeof value!=="string")return "";
    const parts=value.split("|");
    const activity=parts[0].trim().toUpperCase();
    if(!activity.startsWith("T") && !["V","VS"].includes(activity))return "";
    const direct=manifestAltitude(parts[1]);
    if(direct || activity.startsWith("T"))return direct;
    // Video records store the paired tandem's name; use that tandem's altitude.
    const clean=name=>String(name ?? "").trim().toLowerCase().replace(/[_\s]+/g," ");
    const pair=clean(parts[1]);
    if(!pair)return "";
    const tandem=Object.entries(loadValue).find(([uid,raw])=>{
      if(typeof raw!=="string" || !raw.split("|")[0].trim().toUpperCase().startsWith("T"))return false;
      return clean(uid)===pair || clean(displayName(jumpersByUid.get(String(uid)),uid))===pair;
    });
    return tandem?manifestAltitude(tandem[1].split("|")[1]):"";
  }

  function normalizeLoadEntries(loadValue) {
    if (!loadValue || typeof loadValue !== "object") return [];

    const entries=Object.entries(loadValue)
      .filter(([, value]) => value !== null && value !== undefined)
      .map(([uid, value]) => {
        const parsed = parseActivityValue(value);
        return {
          uid: String(uid),
          activity: parsed.activity,
          details: parsed.details,
          specialData: parsed.specialData,
          altitude: loadEntryAltitude(value,loadValue)
        };
      })
      .sort((a, b) => {
        const priorityDiff=loadActivityPriority(a.activity)-loadActivityPriority(b.activity);
        if(priorityDiff!==0)return priorityDiff;
        const altitudeDiff=compareTandemAltitude(a,b);
        if(altitudeDiff!==0)return altitudeDiff;
        const an = displayName(jumpersByUid.get(a.uid), a.uid);
        const bn = displayName(jumpersByUid.get(b.uid), b.uid);
        return an.localeCompare(bn, undefined, { sensitivity: "base" });
      });
    return orderAttachedVideoFlyers(entries,entry=>displayName(jumpersByUid.get(entry.uid),entry.uid));
  }

  function getJumperCount(entries) {
    return entries.reduce(
      (sum, entry) => sum + jumperCountForActivity(entry.activity),
      0
    );
  }

  // Supports:
  // 1) /loads/{load}/{uid}
  // 2) /loads/{day}/{load}/{uid}
  // 3) /loads/{year}/{month}/{day}/{load}/{uid}
  // in case your live node includes a date layer.
  function detectTodayLoads(data, currentData) {
    if (!data || typeof data !== "object") return null;
    const parts = datePartsFromCurrentData(currentData);
    if (!parts) return data;
    const { y, m, d } = parts;
    const mm = m.padStart(2, "0");
    const dd = d.padStart(2, "0");

    const nestedDay = data[y]?.[m]?.[d] ?? data[y]?.[m]?.[dd] ??
      data[y]?.[mm]?.[d] ?? data[y]?.[mm]?.[dd];
    if (nestedDay && typeof nestedDay === "object") return nestedDay;

    const dayNode = data[d] ?? data[dd];
    if (dayNode && typeof dayNode === "object") return dayNode;

    return data;
  }

  function normalizeLoads(loadsNode) {
    if (!loadsNode || typeof loadsNode !== "object") return [];

    return Object.entries(loadsNode)
      .filter(([, value]) => value && typeof value === "object")
      .map(([key, value]) => ({
        key,
        number: getLoadNumber(key),
        value,
        entries: normalizeLoadEntries(value)
      }))
      .sort((a, b) => b.number - a.number);
  }


  function loadStatus(load) {
    if(dayEnded)return "";
    if (inAirLoad === null || inAirLoad === undefined || String(inAirLoad).trim() === "") return "";
    const number = getLoadNumber(inAirLoad);
    if (number <= 0) return "";
    if (load.number === number) return "In air";
    if (load.number === number + 1) return "Next load";
    return "";
  }

  function loadLabel(load) {
    const label = load.number ? `Load ${load.number}` : load.key;
    const status = loadStatus(load);
    return status ? `${label} · ${status}` : label;
  }

  function renderLoadDetail(load) {
    loadTitle.textContent = loadLabel(load);
    loadTitle.classList.toggle("next-load-title", loadStatus(load) === "Next load");

    const count = getJumperCount(load.entries);
    loadSummary.textContent = loadSummaryLabel(load.entries, count);

    renderLoadManifest(loadBody, load.entries, jumpersByUid);
  }

  function renderLoads() {
    loadsList.innerHTML = "";

    if (!currentLoads.length) {
      todayLoadsLayout.hidden = true;
      notStartedCard.hidden = false;
      loadsStatus.textContent = "";
      return;
    }

    notStartedCard.hidden = true;
    todayLoadsLayout.hidden = false;

    const totalJumpers = currentLoads.reduce(
      (sum, load) => sum + getJumperCount(load.entries),
      0
    );

    loadsStatus.textContent =
      `${currentLoads.length} load${currentLoads.length === 1 ? "" : "s"} today · ${totalJumpers} total jumper slot${totalJumpers === 1 ? "" : "s"}`;

    currentLoads.forEach((load, index) => {
      const count = getJumperCount(load.entries);

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "load-row" + (index === 0 ? " active" : "");
      btn.dataset.key=String(load.key);
      highlightPersonalLoad(btn,load.entries,jumpersByUid);
      btn.classList.toggle("next-load", loadStatus(load) === "Next load");

      const left = document.createElement("div");

      const title = document.createElement("div");
      title.className = "load-row-title";
      title.textContent = loadLabel(load);

      const sub = document.createElement("div");
      sub.className = "load-row-sub";
      sub.textContent = `${count} jumper${count === 1 ? "" : "s"}`;

      const arrow = document.createElement("div");
      arrow.className = "load-row-arrow";
      arrow.textContent = "→";

      left.append(title, sub);
      btn.append(left, arrow);

      btn.addEventListener("click", () => {
        document.querySelectorAll(".load-row").forEach(row => row.classList.remove("active"));
        btn.classList.add("active");
        renderLoadDetail(load);
      });

      loadsList.appendChild(btn);
    });

    renderLoadDetail(currentLoads[0]);
  }

  async function loadToday() {
    LoadViewTools.start();
    if(!currentLoads.length)todayLabel.textContent = "Loading current date…";
    loadsStatus.textContent = "Loading current loads…";
    reloadBtn.disabled = true;
    if(!currentLoads.length)document.getElementById("jumperManifestSummary").hidden = true;

    try {
      const [loadsData, jumpersData, currentData] = await Promise.all([
        fetchJson("loads"),
        fetchJson("jumpers"),
        fetchJson("current_data")
      ]);

      LoadViewTools.success();
      inAirLoad = currentData?.in_air_load ?? null;
      dayEnded = currentData?.end_of_day === true;
      jumpersByUid = normalizeJumpers(jumpersData);
      todayLabel.textContent = formatCurrentDataDate(currentData);

      const dayIsRunning = currentData?.day_start === true && currentData?.end_of_day === false;
      if ((!dayIsRunning && !isCurrentDataToday(currentData)) || loadsData === null || loadsData === undefined) {
        currentLoads = [];
        inAirLoad = null;
        dayEnded = false;
        renderJumperManifest(jumpersData);
        todayLoadsLayout.hidden = true;
        notStartedCard.hidden = false;
        loadsStatus.textContent = "";
        return;
      }

      currentLoads = normalizeLoads(loadsData);
      renderJumperManifest(jumpersData);

      if (!currentLoads.length) {
        todayLoadsLayout.hidden = true;
        notStartedCard.hidden = false;
        loadsStatus.textContent = "";
        return;
      }

      renderLoads();
    } catch (err) {
      console.error(err);
      LoadViewTools.failure();
      loadsStatus.textContent = "Could not load the current loads.";
      todayLoadsLayout.hidden = currentLoads.length===0;
      notStartedCard.hidden = true;
    } finally {
      reloadBtn.disabled = false;
    }
  }

  reloadBtn.addEventListener("click", loadToday);
  loadToday();
})();
</script>
</body>
</html>
