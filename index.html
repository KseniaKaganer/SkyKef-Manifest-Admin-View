<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SkyKef Manifest</title>
  <link rel="stylesheet" href="style.css?v=public-admin-split-1">
  <script src="auth.js?v=login-fix-1"></script>
</head>
<body>
<header class="site-header">
  <div class="header-inner home-header">
    <h1 id="siteTitle">SkyKef Manifest</h1>
    <button id="openLoginBtn" class="small-btn header-login-btn" type="button">Login</button>
  </div>
</header>

<main class="page">
  <section id="publicLoadsCard" class="public-loads-card" aria-labelledby="publicLoadsTitle">
    <div>
      <p class="public-loads-kicker">Public manifest</p>
      <h2 id="publicLoadsTitle">Today's Loads</h2>
      <p id="publicLoadsStatus" class="public-loads-status" aria-live="polite">Checking today's loads…</p>
    </div>
    <a id="publicLoadsLink" class="big-btn public-loads-link" href="loads-today.html" hidden>
      <span>View Today's Loads</span><span>→</span>
    </a>
    <div id="publicDayNotStarted" class="public-day-message" hidden>
      <strong>Day has not started yet</strong>
      <span>Today's loads will appear here when they are ready.</span>
    </div>
  </section>

  <div id="loginOverlay" class="login-overlay" hidden>
    <section id="loginCard" class="login-card" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <button id="closeLoginBtn" class="login-close" type="button" aria-label="Close login">×</button>
      <h2 id="loginTitle">Login</h2>
      <p>Enter your username and password.</p>
      <form id="loginForm" class="login-form">
        <label>
          <span>Username</span>
          <select id="username" name="username" autocomplete="username" required disabled><option value="">Loading usernames…</option></select>
        </label>
        <label>
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button id="loginBtn" class="small-btn" type="submit">Login</button>
        <div id="loginStatus" class="login-status" aria-live="polite"></div>
      </form>
    </section>
  </div>

  <section id="adminHome" hidden>
    <section class="hero admin-home-head">
      <div>
        <h2>Manifest overview</h2>
        <p id="welcomeAdmin"></p>
      </div>
      <button id="logoutBtn" class="small-btn" type="button">Logout</button>
    </section>
    <section class="button-grid">
      <a class="big-btn" href="jumpers-data.html"><span>Jumpers Data</span><span>→</span></a>
      <a class="big-btn" href="loads.html"><span>Loads</span><span>→</span></a>
      <a class="big-btn" href="loads-history.html"><span>Loads History</span><span>→</span></a>
      <a class="big-btn" href="reports.html"><span>Reports</span><span>→</span></a>
    </section>
  </section>
</main>

<script>
(() => {
  const DB = "https://skykef-app-default-rtdb.europe-west1.firebasedatabase.app";
  const siteTitle = document.getElementById("siteTitle");
  const publicLoadsCard = document.getElementById("publicLoadsCard");
  const loginCard = document.getElementById("loginCard");
  const loginOverlay = document.getElementById("loginOverlay");
  const openLoginBtn = document.getElementById("openLoginBtn");
  const closeLoginBtn = document.getElementById("closeLoginBtn");
  const adminHome = document.getElementById("adminHome");
  const loginForm = document.getElementById("loginForm");
  const loginBtn = document.getElementById("loginBtn");
  const loginStatus = document.getElementById("loginStatus");
  const welcomeAdmin = document.getElementById("welcomeAdmin");
  const logoutBtn = document.getElementById("logoutBtn");
  const publicLoadsStatus = document.getElementById("publicLoadsStatus");
  const publicLoadsLink = document.getElementById("publicLoadsLink");
  const publicDayNotStarted = document.getElementById("publicDayNotStarted");

  function datePartsFromCurrentData(currentData) {
    const raw = currentData?.date;
    if (raw === null || raw === undefined || String(raw).trim() === "") return null;
    const value = String(raw).trim();
    let match = value.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
    if (match) return { y: match[1], m: String(Number(match[2])), d: String(Number(match[3])) };
    match = value.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
    if (match) return { y: match[3], m: String(Number(match[2])), d: String(Number(match[1])) };
    return null;
  }

  function findTodayLoads(data, currentData) {
    if (!data || typeof data !== "object") return null;
    const parts = datePartsFromCurrentData(currentData);
    if (!parts) return data;
    const { y, m, d } = parts;
    const mm = m.padStart(2, "0");
    const dd = d.padStart(2, "0");

    const nestedDay = data[y]?.[m]?.[d] ?? data[y]?.[m]?.[dd] ??
      data[y]?.[mm]?.[d] ?? data[y]?.[mm]?.[dd];
    if (nestedDay && typeof nestedDay === "object") return nestedDay;

    const dayNode = data[d] ?? data[dd];
    if (dayNode && typeof dayNode === "object") return dayNode;

    return data;
  }

  function hasLoadRecords(loadsNode) {
    return Boolean(loadsNode && typeof loadsNode === "object" &&
      Object.values(loadsNode).some(load =>
        load && typeof load === "object" &&
        Object.values(load).some(value => value !== null && value !== undefined)
      ));
  }

  async function checkPublicLoads() {
    try {
      const [loadsResponse, currentDataResponse] = await Promise.all([
        fetch(`${DB}/loads.json`, { cache: "no-store" }),
        fetch(`${DB}/current_data.json`, { cache: "no-store" })
      ]);
      if (!loadsResponse.ok) throw new Error(`Loads check failed: HTTP ${loadsResponse.status}`);
      if (!currentDataResponse.ok) throw new Error(`Current data check failed: HTTP ${currentDataResponse.status}`);

      const [loadsData, currentData] = await Promise.all([
        loadsResponse.json(),
        currentDataResponse.json()
      ]);
      const loads = findTodayLoads(loadsData, currentData);

      if (hasLoadRecords(loads)) {
        const date = currentData?.date;
        publicLoadsStatus.textContent = date ? `Loads for ${date} are available to view.` : "The current manifest is available to view.";
        publicLoadsLink.hidden = false;
        publicLoadsLink.setAttribute("aria-hidden", "false");
        publicDayNotStarted.hidden = true;
      } else {
        publicLoadsStatus.textContent = "";
        publicLoadsLink.hidden = true;
        publicLoadsLink.setAttribute("aria-hidden", "true");
        publicDayNotStarted.hidden = false;
      }
    } catch (error) {
      console.error(error);
      publicLoadsStatus.textContent = "Could not check the current loads. Please try again.";
      publicLoadsLink.hidden = true;
      publicLoadsLink.setAttribute("aria-hidden", "true");
      publicDayNotStarted.hidden = true;
    }
  }

  function closeLogin() {
    loginOverlay.hidden = true;
    loginStatus.textContent = "";
  }

  function openLogin() {
    loginOverlay.hidden = false;
    requestAnimationFrame(() => document.getElementById("username").focus());
  }

  function showHome(session) {
    closeLogin();
    document.title = "SkyKef Manifest Admin View";
    siteTitle.textContent = "SkyKef Manifest Admin View";
    publicLoadsCard.hidden = true;
    openLoginBtn.hidden = true;
    adminHome.hidden = false;
    welcomeAdmin.textContent = `Logged in as ${session.username} · ${session.role === "admin" ? "Admin" : "Manifest"}`;
    SkyKefAdminAuth.showSessionRole();
  }

  const existing = SkyKefAdminAuth.getSession();
  if (existing) showHome(existing);

  const usernameSelect = document.getElementById("username");
  let loginUsers = [];
  loginBtn.disabled = true;
  SkyKefAdminAuth.getLoginUsers().then(users => {
    loginUsers = users;
    usernameSelect.replaceChildren();
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Select username";
    usernameSelect.appendChild(placeholder);
    ["admin", "manifest"].forEach(role => {
      const group = document.createElement("optgroup");
      group.label = role === "admin" ? "Admin" : "Manifest";
      users.forEach((user, index) => {
        if (user.role !== role) return;
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = user.username;
        group.appendChild(option);
      });
      usernameSelect.appendChild(group);
    });
    usernameSelect.disabled = users.length === 0;
    loginBtn.disabled = users.length === 0;
    if (!users.length) loginStatus.textContent = "No login users found.";
  }).catch(() => {
    loginStatus.textContent = "Could not load usernames. Reload to retry.";
  });

  loginForm.addEventListener("submit", async event => {
    event.preventDefault();
    loginStatus.textContent = "";
    loginBtn.disabled = true;
    loginBtn.textContent = "Checking…";

    const user = usernameSelect.value === "" ? null : loginUsers[Number(usernameSelect.value)];
    const username = user?.username || "";
    const password = document.getElementById("password").value;

    try {
      const valid = await SkyKefAdminAuth.verifyUser(username, password, user?.role);
      if (!valid) {
        loginStatus.textContent = "Incorrect username or password.";
        return;
      }
      SkyKefAdminAuth.createSession(username, user.role);
      showHome(SkyKefAdminAuth.getSession());
      loginForm.reset();
    } catch (error) {
      console.error(error);
      loginStatus.textContent = "Could not verify login. Check Firebase access.";
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Login";
    }
  });

  openLoginBtn.addEventListener("click", openLogin);
  closeLoginBtn.addEventListener("click", closeLogin);
  loginOverlay.addEventListener("click", event => {
    if (event.target === loginOverlay) closeLogin();
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !loginOverlay.hidden) closeLogin();
  });
  logoutBtn.addEventListener("click", SkyKefAdminAuth.logout);
  checkPublicLoads();
})();
</script>
</body>
</html>
