<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SkyKef Manifest Admin View</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js"></script>
</head>
<body>
<header class="site-header">
  <div class="header-inner"><h1>SkyKef Manifest Admin View</h1></div>
</header>

<main class="page">
  <section id="loginCard" class="login-card">
    <h2>Login</h2>
    <p>Select an admin or manifest user and enter your password.</p>
    <form id="loginForm" class="login-form">
      <label>
        <span>Username</span>
        <select id="username" name="username" autocomplete="username" required disabled><option value="">Loading usernames…</option></select>
      </label>
      <label>
        <span>Password</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button id="loginBtn" class="small-btn" type="submit">Login</button>
      <div id="loginStatus" class="login-status" aria-live="polite"></div>
    </form>
  </section>

  <section id="adminHome" hidden>
    <section class="hero admin-home-head">
      <div>
        <h2>Manifest overview</h2>
        <p id="welcomeAdmin"></p>
      </div>
      <button id="logoutBtn" class="small-btn" type="button">Logout</button>
    </section>
    <section class="button-grid">
      <a class="big-btn" href="jumpers-data.html"><span>Jumpers Data</span><span>→</span></a>
      <a class="big-btn" href="loads.html"><span>Loads</span><span>→</span></a>
      <a class="big-btn" href="loads-history.html"><span>Loads History</span><span>→</span></a>
      <a class="big-btn" href="reports.html"><span>Reports</span><span>→</span></a>
    </section>
  </section>
</main>

<script>
(() => {
  const loginCard = document.getElementById("loginCard");
  const adminHome = document.getElementById("adminHome");
  const loginForm = document.getElementById("loginForm");
  const loginBtn = document.getElementById("loginBtn");
  const loginStatus = document.getElementById("loginStatus");
  const welcomeAdmin = document.getElementById("welcomeAdmin");
  const logoutBtn = document.getElementById("logoutBtn");

  function showHome(session) {
    loginCard.hidden = true;
    adminHome.hidden = false;
    welcomeAdmin.textContent = `Logged in as ${session.username} · ${session.role === "admin" ? "Admin" : "Manifest"}`;
    SkyKefAdminAuth.showSessionRole();
  }

  const existing = SkyKefAdminAuth.getSession();
  if (existing) showHome(existing);

  const usernameSelect = document.getElementById("username");
  let loginUsers = [];
  loginBtn.disabled = true;
  SkyKefAdminAuth.getLoginUsers().then(users => {
    loginUsers = users;
    usernameSelect.replaceChildren();
    const placeholder = document.createElement("option");
    placeholder.value = ""; placeholder.textContent = "Select username";
    usernameSelect.appendChild(placeholder);
    ["admin", "manifest"].forEach(role => {
      const group = document.createElement("optgroup"); group.label = role === "admin" ? "Admin" : "Manifest";
      users.forEach((user, index) => {
        if (user.role !== role) return;
        const option = document.createElement("option");
        option.value = String(index); option.textContent = user.username;
        group.appendChild(option);
      });
      usernameSelect.appendChild(group);
    });
    usernameSelect.disabled = users.length === 0;
    loginBtn.disabled = users.length === 0;
    if (!users.length) loginStatus.textContent = "No login users found.";
  }).catch(() => {
    loginStatus.textContent = "Could not load usernames. Reload to retry.";
  });

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    loginStatus.textContent = "";
    loginBtn.disabled = true;
    loginBtn.textContent = "Checking…";

    const user = usernameSelect.value === "" ? null : loginUsers[Number(usernameSelect.value)];
    const username = user?.username || "";
    const password = document.getElementById("password").value;

    try {
      const valid = await SkyKefAdminAuth.verifyUser(username, password, user?.role);
      if (!valid) {
        loginStatus.textContent = "Incorrect username or password.";
        return;
      }
      SkyKefAdminAuth.createSession(username, user.role);
      showHome(SkyKefAdminAuth.getSession());
      loginForm.reset();
    } catch (error) {
      console.error(error);
      loginStatus.textContent = "Could not verify login. Check Firebase access.";
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Login";
    }
  });

  logoutBtn.addEventListener("click", SkyKefAdminAuth.logout);
})();
</script>
</body>
</html>
