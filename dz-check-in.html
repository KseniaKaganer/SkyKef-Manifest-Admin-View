<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DZ Check-in | SkyKef Manifest</title>
<link rel="stylesheet" href="style.css?v=settings-theme-1">
<script src="preferences.js?v=dz-check-in-13"></script>
<script src="auth.js?v=dz-check-in-12"></script>
<link rel="stylesheet" href="theme.css?v=logbook-years-13">
<style>
.check-in-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.check-in-heading h2{margin:0}
.check-in-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.check-in-actions a{display:inline-flex;align-items:center;justify-content:center}
.check-in-frame{width:100%;height:78vh;min-height:480px;border:1px solid var(--border);border-radius:12px;background:#fff}
.check-in-print{width:48px;padding:10px}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner"><h1>SkyKef Manifest</h1></div></header>
<main id="checkInPage" class="page" hidden>
<div class="check-in-heading"><h2>DZ Check-in</h2><div class="check-in-actions">
<a class="small-btn" href="https://drive.google.com/file/d/1LhNcarB68GS778QXEAmnw4V0WtoHwKcM/view?usp=sharing" target="_blank" rel="noopener noreferrer">Open in Google Drive</a>
<a class="small-btn check-in-print" href="https://drive.google.com/file/d/1LhNcarB68GS778QXEAmnw4V0WtoHwKcM/view?usp=sharing" target="_blank" rel="noopener noreferrer" title="Print file" aria-label="Print file"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6zM18 12h.01"/></svg></a>
</div></div>
<p class="status">Print opens the file in Google Drive. Use the viewer’s print button.</p>
<iframe id="checkInFrame" class="check-in-frame" title="DZ Check-in" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</main>
<script>
(async()=>{
 if(!await SkyKefAdminAuth.ready || !SkyKefAdminAuth.isAdmin())return;
 document.getElementById('checkInPage').hidden=false;
 document.getElementById('checkInFrame').src='https://drive.google.com/file/d/1LhNcarB68GS778QXEAmnw4V0WtoHwKcM/preview';
})();
</script>
</body>
</html>
