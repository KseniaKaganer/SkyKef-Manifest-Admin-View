<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Profile | SkyKef Manifest</title>
  <link rel="stylesheet" href="style.css?v=delete-info-1">
  <script src="auth.js?v=delete-info-1"></script>
</head>
<body>
<header class="site-header">
  <div class="header-inner home-header">
    <h1>My Profile</h1>
    <div class="header-account-actions">
      <a class="small-btn header-profile-btn" href="index.html">Home</a>
      <button id="logoutBtn" class="small-btn" type="button">Logout</button>
    </div>
  </div>
</header>

<main class="page">
  <section class="hero"><h2 id="profileName">My Profile</h2><p>Your personal details and logbook</p></section>
  <section id="userProfileSection" class="user-profile-section" hidden aria-label="My account">
    <div class="detail-tabs" role="tablist" aria-label="My information">
      <button id="userProfileTab" class="detail-tab active" type="button" role="tab" aria-selected="true">My Profile</button>
      <button id="userLogbookTab" class="detail-tab" type="button" role="tab" aria-selected="false">My Logbook</button>
    </div>
    <div id="userProfileView">
      <div id="userProfileStatus" class="status">Loading profile…</div>
      <dl id="userProfileDetails" class="profile-details"></dl>
    </div>
    <div id="userLogbookView" hidden>
      <div class="user-logbook-toolbar">
        <div id="userLogbookStatus" class="status">Open this tab to load your logbook.</div>
        <button id="exportUserLogbookBtn" class="small-btn" type="button" disabled>Export CSV</button>
      </div>
      <div class="load-table-scroll">
        <table class="load-table user-logbook-table">
          <thead><tr><th>Date</th><th>Load</th><th>Activity</th><th>Details</th></tr></thead>
          <tbody id="userLogbookBody"></tbody>
        </table>
      </div>
    </div>
  </section>

</main>
<script src="jumper-profile.js?v=hide-today-count-1"></script>
</body></html>
