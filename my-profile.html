<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Profile | SkyKef Manifest</title>
  <link rel="stylesheet" href="style.css?v=settings-theme-1">
  <script src="preferences.js?v=logbook-types-2"></script>
<script src="auth.js?v=settings-icon-5"></script>
<link rel="stylesheet" href="theme.css?v=settings-icon-5">
</head>
<body>
<header class="site-header">
  <div class="header-inner home-header">
    <h1>My Profile</h1>
    <div class="header-account-actions">
      <a class="small-btn header-profile-btn" href="index.html">Home</a>
      <button id="logoutBtn" class="small-btn" type="button">Logout</button>
    </div>
  </div>
</header>

<main class="page">
  <section id="userProfileSection" class="user-profile-section" hidden aria-label="My account">
    <div class="detail-tabs" role="tablist" aria-label="My information">
      <button id="userProfileTab" class="detail-tab active" type="button" role="tab" aria-selected="true">My Profile</button>
      <button id="userLogbookTab" class="detail-tab" type="button" role="tab" aria-selected="false">My Logbook</button>
    </div>
    <div id="userProfileView">
      <div id="userProfileStatus" class="status">Loading profile…</div>
      <dl id="userProfileDetails" class="profile-details"></dl>
    </div>
    <div id="userLogbookView" hidden>
      <fieldset id="logbookFilters" class="logbook-filters" disabled>
        <legend>Filter logbook</legend>
        <fieldset class="logbook-type-filter"><legend>Jump types</legend><div id="logbookTypeOptions" class="logbook-type-options"></div></fieldset>
        <div class="logbook-filter-controls">
          <label><span>From date</span><input id="logbookFromDate" type="date"></label>
          <label><span>To date</span><input id="logbookToDate" type="date"></label>
          <label><span>Sort order</span><select id="logbookSortOrder"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></label>
          <button id="resetLogbookFilters" class="small-btn" type="button">Reset filters</button>
        </div>
      </fieldset>
      <section id="userLogbookAnnualStats" class="logbook-annual-stats" hidden></section>
      <div class="user-logbook-toolbar">
        <div id="userLogbookStatus" class="status">Open this tab to load your logbook.</div>
        <button id="exportUserLogbookBtn" class="small-btn" type="button" disabled>Export CSV</button>
      </div>
      <div class="load-table-scroll">
        <table class="load-table user-logbook-table">
          <thead><tr><th>Date</th><th>Load</th><th>Activity</th><th>Details</th></tr></thead>
          <tbody id="userLogbookBody"></tbody>
        </table>
      </div>
    </div>
  </section>

</main>
<script src="logbook-annual-stats.js?v=actual-jumps-1"></script>
<script src="logbook-filters.js?v=logbook-types-2"></script>
<script src="jumper-profile.js?v=profile-header-3"></script>
</body></html>
